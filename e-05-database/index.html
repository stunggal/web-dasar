<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Menampilkan Data Database</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h2>Daftar Data dari Database Lokal</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Email</th>
                <th>Jurusan</th>
            </tr>
        </thead>
        <tbody>
            <?php if (!empty($dataMahasiswa)): ?>
            <?php foreach ($dataMahasiswa as $row): ?>
            <tr>
                <!-- Sesuaikan nama kolom dengan yang ada di database Anda -->
                <td>
                    <?= htmlspecialchars($row['id']); ?>
                </td>
                <td>
                    <?= htmlspecialchars($row['nama']); ?>
                </td>
                <td>
                    <?= htmlspecialchars($row['email']); ?>
                </td>
                <td>
                    <?= htmlspecialchars($row['jurusan']); ?>
                </td>
            </tr>
            <?php endforeach; ?>
            <?php else: ?>
            <tr>
                <td colspan="4" style="text-align: center;">Tidak ada data ditemukan.</td>
            </tr>
            <?php endif; ?>
        </tbody>
    </table>

</body>

</html>
