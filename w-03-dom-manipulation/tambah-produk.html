<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockKu - Tambah Produk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-box-seam me-2"></i>StockKu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>
                            Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="produk.html"><i class="bi bi-box me-1"></i>
                            Produk</a></li>
                    <li class="nav-item"><a class="nav-link" href="pesanan.html"><i class="bi bi-receipt me-1"></i>
                            Pesanan</a></li>
                    <li class="nav-item"><a class="nav-link" href="akun.html"><i class="bi bi-person-circle me-1"></i>
                            Akun</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a href="produk.html" class="text-decoration-none">Produk</a></li>
                <li class="breadcrumb-item active">Tambah Produk</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-1">Tambah Produk</h4>
                <p class="text-muted small mb-0">Isi 1 baris form untuk produk baru</p>
            </div>
            <a href="produk.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>
                Kembali</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white fw-semibold">
                <i class="bi bi-box me-2"></i>Form Produk
            </div>
            <div class="card-body">
                <form>
                    <!-- Header label (desktop) -->
                    <div class="row g-2 d-none d-md-flex mb-1">
                        <div class="col-md-3"><label class="form-label small fw-semibold text-muted mb-0">Nama
                                Produk</label></div>
                        <div class="col-md-2"><label
                                class="form-label small fw-semibold text-muted mb-0">Kategori</label></div>
                        <div class="col-md-2"><label class="form-label small fw-semibold text-muted mb-0">SKU</label>
                        </div>
                        <div class="col-md-2"><label class="form-label small fw-semibold text-muted mb-0">Harga</label>
                        </div>
                        <div class="col-md-1"><label class="form-label small fw-semibold text-muted mb-0">Stok</label>
                        </div>
                        <div class="col-md-2"></div>
                    </div>

                    <!-- 1 baris form -->
                    <div id="formRowContainer">
                        <!-- copy dari sini -->
                        <div class="row g-2 align-items-end product-row mb-2">
                            <div class="col-12 col-md-3">
                                <label class="form-label d-md-none small fw-semibold">Nama Produk</label>
                                <input type="text" class="form-control" placeholder="Contoh: Kaos Polos">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label d-md-none small fw-semibold">Kategori</label>
                                <select class="form-select">
                                    <option selected disabled>Pilih</option>
                                    <option>Pakaian</option>
                                    <option>Sepatu</option>
                                    <option>Aksesoris</option>
                                    <option>Elektronik</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label d-md-none small fw-semibold">SKU</label>
                                <input type="text" class="form-control" placeholder="SKU-006">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label d-md-none small fw-semibold">Harga</label>
                                <div class="input-group">
                                    <span class="input-group-text">Rp</span>
                                    <input type="number" class="form-control" placeholder="0">
                                </div>
                            </div>
                            <div class="col-6 col-md-1">
                                <label class="form-label d-md-none small fw-semibold">Stok</label>
                                <input type="number" class="form-control" placeholder="0">
                            </div>
                            <div class="col-12 col-md-2 d-none d-md-block text-end">
                                <button type="button" class="btn btn-outline-danger btn-sm w-100 btn-delete" disabled><i
                                        class="bi bi-trash me-1"></i> Hapus</button>
                            </div>
                        </div>
                        <!-- copy sampai sini -->
                    </div>


                    <!-- Tombol tambah item (do nothing) -->
                    <div class="mt-3">
                        <button type="button" id="btnAddRow" class="btn btn-outline-primary btn-sm"><i
                                class="bi bi-plus-lg me-1"></i>
                            Tambah Item</button>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="produk.html" class="btn btn-secondary">Batal</a>
                        <button type="button" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Simpan
                            Produk</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-white border-top py-3 mt-4">
        <div class="container text-center text-muted small">&copy; 2026 StockKu</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // TODO: Tambahkan logika JavaScript untuk menambahkan dan menghapus baris form produk
    </script>

</body>

</html>
